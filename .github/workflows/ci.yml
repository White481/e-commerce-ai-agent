name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      # No warehouse or API key here: the integration tests skip themselves,
      # everything else runs against a fake LLM / schema / executor
      - name: Test
        run: pytest -q -rs
